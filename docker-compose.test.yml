# Disposable test-only stack. Callers must provide a checkout/run-specific
# project name so this cannot collide with development or another test run.
name: ${MEM_TEST_PROJECT:?set MEM_TEST_PROJECT to an isolated Compose project name}

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    environment:
      POSTGRES_USER: mem
      POSTGRES_PASSWORD: mem
      POSTGRES_DB: ${MEM_TEST_DB_NAME:-mem_integration_test}
    ports:
      - "127.0.0.1:${MEM_TEST_PG_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 5s

  minio:
    profiles: ["e2e"]
    # Official community container pulls are unavailable. Build only the test
    # dependency from pinned upstream commits; see scripts/test-minio/Dockerfile.
    image: mem-test-minio:7aac2a2c5b7c-77f82e18b540
    build:
      context: ./scripts/test-minio
    pull_policy: build
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mem
      MINIO_ROOT_PASSWORD: mem-minio-password
    ports:
      - "127.0.0.1:${MEM_TEST_S3_PORT:-59100}:9000"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 5s

  minio-init:
    profiles: ["e2e"]
    image: mem-test-minio:7aac2a2c5b7c-77f82e18b540
    build:
      context: ./scripts/test-minio
    pull_policy: build
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - |
        mc alias set local http://minio:9000 mem mem-minio-password
        mc mb --ignore-existing local/mem
        mc anonymous set none local/mem
