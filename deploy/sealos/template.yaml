apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: mem-personal-preview
spec:
  title: 'mem personal preview'
  url: 'https://github.com/bytefolk/mem'
  gitRepo: 'https://github.com/bytefolk/mem'
  author: 'bytefolk'
  description: 'Single-owner GitHub preview with private pgvector, Redis and object storage.'
  readme: 'Use deploy/sealos/README.md. Supply built public amd64 images and runtime OAuth/Worker secrets. Model providers are not bundled.'
  icon: ''
  templateType: inline
  locale: en
  categories: []
  defaults:
    app_name:
      type: string
      value: mem-${{ random(8) }}
    app_host:
      type: string
      value: mem-${{ random(8) }}
    db_password:
      type: string
      value: ${{ random(32) }}
    redis_password:
      type: string
      value: ${{ random(32) }}
  inputs:
    server_image:
      description: 'Public linux/amd64 server image, pinned to the reviewed commit or digest'
      type: string
      required: true
      default: ''
    web_image:
      description: 'Public linux/amd64 Web image from the same revision'
      type: string
      required: true
      default: ''
    worker_image:
      description: 'Public linux/amd64 model-free Worker image from the same revision'
      type: string
      required: true
      default: ''
    github_client_id:
      description: 'Operator-owned GitHub OAuth App client ID'
      type: string
      required: true
      default: ''
    github_client_secret:
      description: 'Runtime GitHub OAuth App secret; never use a build argument'
      type: string
      required: true
      default: ''
    github_allowed_user_ids:
      description: 'Comma-separated immutable GitHub numeric subjects'
      type: string
      required: true
      default: '47820304'
    worker_auth_key_b64:
      description: 'Fresh standard Base64 encoding of exactly 32 random bytes'
      type: string
      required: true
      default: ''
---
apiVersion: v1
kind: Secret
metadata:
  name: ${{ defaults.app_name }}-runtime
  labels:
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
type: Opaque
stringData:
  DB_PASSWORD: ${{ defaults.db_password }}
  REDIS_PASSWORD: ${{ defaults.redis_password }}
  MEM_GITHUB_CLIENT_ID: ${{ inputs.github_client_id }}
  MEM_GITHUB_CLIENT_SECRET: ${{ inputs.github_client_secret }}
  MEM_WORKER_AUTH_KEY_B64: ${{ inputs.worker_auth_key_b64 }}
---
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
spec:
  policy: private
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-postgres
  annotations:
    originImageName: pgvector/pgvector:0.8.1-pg16
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-postgres
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-postgres
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
spec:
  serviceName: ${{ defaults.app_name }}-postgres
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels: { app: '${{ defaults.app_name }}-postgres' }
  template:
    metadata:
      labels: { app: '${{ defaults.app_name }}-postgres' }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-postgres
          image: pgvector/pgvector:0.8.1-pg16
          imagePullPolicy: IfNotPresent
          env:
            - { name: POSTGRES_USER, value: mem_preview }
            - { name: POSTGRES_DB, value: mem_preview }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: '${{ defaults.app_name }}-runtime', key: DB_PASSWORD } }
          ports: [{ name: postgres, containerPort: 5432 }]
          readinessProbe:
            exec: { command: [pg_isready, -U, mem_preview, -d, mem_preview] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 51Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: vn-varvn-libvn-postgresqlvn-data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata:
        name: vn-varvn-libvn-postgresqlvn-data
        labels: { cloud.sealos.io/deploy-on-sealos: '${{ defaults.app_name }}' }
        annotations: { path: /var/lib/postgresql/data, value: '1' }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-postgres
  labels:
    app: ${{ defaults.app_name }}-postgres
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-postgres
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
spec:
  ports: [{ name: postgres, port: 5432, targetPort: 5432 }]
  selector: { app: '${{ defaults.app_name }}-postgres' }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-redis
  annotations:
    originImageName: redis:7.4-alpine
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-redis
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-redis
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
spec:
  serviceName: ${{ defaults.app_name }}-redis
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels: { app: '${{ defaults.app_name }}-redis' }
  template:
    metadata:
      labels: { app: '${{ defaults.app_name }}-redis' }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          args: [redis-server, --requirepass, '$(REDISCLI_AUTH)', --appendonly, 'yes']
          env:
            - name: REDISCLI_AUTH
              valueFrom: { secretKeyRef: { name: '${{ defaults.app_name }}-runtime', key: REDIS_PASSWORD } }
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 25Mi }
            limits: { cpu: 200m, memory: 256Mi }
          volumeMounts:
            - { name: vn-data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: vn-data
        labels: { cloud.sealos.io/deploy-on-sealos: '${{ defaults.app_name }}' }
        annotations: { path: /data, value: '1' }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    app: ${{ defaults.app_name }}-redis
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-redis
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
spec:
  ports: [{ name: redis, port: 6379, targetPort: 6379 }]
  selector: { app: '${{ defaults.app_name }}-redis' }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-memd
  annotations:
    originImageName: ${{ inputs.server_image }}
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-memd
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-memd
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
spec:
  serviceName: ${{ defaults.app_name }}-memd
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels: { app: '${{ defaults.app_name }}-memd' }
  template:
    metadata:
      labels: { app: '${{ defaults.app_name }}-memd' }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532 }
      initContainers:
        - name: migrate
          image: ${{ inputs.server_image }}
          command: [/usr/local/bin/mem-migrate]
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: '${{ defaults.app_name }}-runtime', key: DB_PASSWORD } }
            - name: MEM_DB_URL
              value: postgres://mem_preview:$(DB_PASSWORD)@${{ defaults.app_name }}-postgres.${{ SEALOS_NAMESPACE }}.svc.cluster.local:5432/mem_preview?sslmode=disable
          resources:
            requests: { cpu: 50m, memory: 25Mi }
            limits: { cpu: 500m, memory: 256Mi }
      containers:
        - name: ${{ defaults.app_name }}-memd
          image: ${{ inputs.server_image }}
          imagePullPolicy: IfNotPresent
          envFrom: [{ secretRef: { name: '${{ defaults.app_name }}-runtime' } }]
          env:
            - { name: MEM_HTTP_ADDR, value: ':8080' }
            - { name: MEM_RUNTIME_PROFILE, value: production }
            - { name: MEM_AUTO_MIGRATE, value: 'false' }
            - { name: MEM_DEPLOYMENT_MODE, value: private }
            - { name: MEM_REGISTRATION_MODE, value: disabled }
            - { name: MEM_GITHUB_BOOTSTRAP, value: 'true' }
            - { name: MEM_GITHUB_ALLOWED_USER_IDS, value: '${{ inputs.github_allowed_user_ids }}' }
            - { name: MEM_PUBLIC_URL, value: 'https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}' }
            - { name: MEM_AI_PROFILES, value: local-fast-v2 }
            - { name: MEM_SESSION_TTL, value: 24h }
            - { name: MEM_WORKER_AUTH_KEY_ID, value: preview-v1 }
            - { name: MEM_WORKER_GRPC, value: '${{ defaults.app_name }}-worker.${{ SEALOS_NAMESPACE }}.svc.cluster.local:50051' }
            - { name: MEM_WORKSPACE_TRANSFER_TMP_DIR, value: /tmp/mem-workspace-transfers }
            - { name: MEM_WORKSPACE_BUNDLE_MAX_BYTES, value: '536870912' }
            - { name: MEM_WORKSPACE_TRANSFER_MAX_CONCURRENT, value: '1' }
            - name: MEM_DB_URL
              value: postgres://mem_preview:$(DB_PASSWORD)@${{ defaults.app_name }}-postgres.${{ SEALOS_NAMESPACE }}.svc.cluster.local:5432/mem_preview?sslmode=disable
            - name: MEM_REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@${{ defaults.app_name }}-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local:6379/0
            - name: MEM_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: object-storage-key, key: accessKey } }
            - name: MEM_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: object-storage-key, key: secretKey } }
            - name: S3_ENDPOINT_HOST
              valueFrom: { secretKeyRef: { name: object-storage-key, key: external } }
            - { name: MEM_S3_ENDPOINT, value: 'https://$(S3_ENDPOINT_HOST)' }
            - { name: MEM_S3_USE_SSL, value: 'true' }
            - name: MEM_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
                  key: bucket
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: 100m, memory: 51Mi }
            limits: { cpu: '1', memory: 512Mi }
          volumeMounts: [{ name: vn-tmp, mountPath: /tmp }]
  volumeClaimTemplates:
    - metadata:
        name: vn-tmp
        labels: { cloud.sealos.io/deploy-on-sealos: '${{ defaults.app_name }}' }
        annotations: { path: /tmp, value: '1' }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-memd
  labels:
    app: ${{ defaults.app_name }}-memd
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-memd
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
spec:
  ports: [{ name: http, port: 8080, targetPort: http }]
  selector: { app: '${{ defaults.app_name }}-memd' }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-worker
  annotations:
    originImageName: ${{ inputs.worker_image }}
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-worker
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-worker
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
spec:
  serviceName: ${{ defaults.app_name }}-worker
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels: { app: '${{ defaults.app_name }}-worker' }
  template:
    metadata:
      labels: { app: '${{ defaults.app_name }}-worker' }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      containers:
        - name: ${{ defaults.app_name }}-worker
          image: ${{ inputs.worker_image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: '${{ defaults.app_name }}-runtime', key: REDIS_PASSWORD } }
            - name: MEM_WORKER_AUTH_KEY_B64
              valueFrom: { secretKeyRef: { name: '${{ defaults.app_name }}-runtime', key: MEM_WORKER_AUTH_KEY_B64 } }
            - { name: MEM_DEPLOYMENT_MODE, value: private }
            - { name: MEM_WORKER_GRPC_HOST, value: 0.0.0.0 }
            - { name: MEM_WORKER_GRPC_PORT, value: '50051' }
            - { name: MEM_WORKER_GRPC_MAX_WORKERS, value: '2' }
            - { name: MEM_WORKER_AUTH_MODE, value: required }
            - { name: MEM_WORKER_AUTH_KEY_ID, value: preview-v1 }
            - { name: MEM_WORKER_AUTH_REPLAY_REDIS_URL, value: 'redis://:$(REDIS_PASSWORD)@${{ defaults.app_name }}-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local:6379/1' }
            - { name: MEM_LOG_JSON, value: 'true' }
            - { name: XDG_CACHE_HOME, value: /tmp/cache }
            - { name: HF_HOME, value: /tmp/huggingface }
            - name: MEM_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: object-storage-key, key: accessKey } }
            - name: MEM_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: object-storage-key, key: secretKey } }
            - name: S3_ENDPOINT_HOST
              valueFrom: { secretKeyRef: { name: object-storage-key, key: external } }
            - { name: MEM_S3_ENDPOINT, value: 'https://$(S3_ENDPOINT_HOST)' }
            - { name: MEM_S3_USE_SSL, value: 'true' }
            - name: MEM_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
                  key: bucket
          ports: [{ name: grpc, containerPort: 50051 }]
          startupProbe:
            exec: { command: [python, -m, mem_worker.healthcheck] }
            timeoutSeconds: 15
            periodSeconds: 15
            failureThreshold: 12
          readinessProbe:
            exec: { command: [python, -m, mem_worker.healthcheck] }
            timeoutSeconds: 10
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec: { command: [python, -m, mem_worker.healthcheck] }
            timeoutSeconds: 10
            initialDelaySeconds: 30
            periodSeconds: 15
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: 50m, memory: 51Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts: [{ name: vn-tmp, mountPath: /tmp }]
  volumeClaimTemplates:
    - metadata:
        name: vn-tmp
        labels: { cloud.sealos.io/deploy-on-sealos: '${{ defaults.app_name }}' }
        annotations: { path: /tmp, value: '1' }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-worker
  labels:
    app: ${{ defaults.app_name }}-worker
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-worker
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
spec:
  ports: [{ name: grpc, port: 50051, targetPort: grpc }]
  selector: { app: '${{ defaults.app_name }}-worker' }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
data:
  vn-etcvn-memvn-startvn-webvn-sh: |
    #!/bin/sh
    set -eu
    # Only application inputs are substituted; nginx's own variables stay intact.
    envsubst '${MEMD_UPSTREAM} ${MEM_MAX_BODY_SIZE}' \
      < /etc/nginx/templates/default.conf.template > /tmp/default.conf
    sed 's@/etc/nginx/conf.d/\*.conf@/tmp/default.conf@' \
      /etc/nginx/nginx.conf > /tmp/nginx.conf
    nginx -t -c /tmp/nginx.conf
    exec nginx -c /tmp/nginx.conf -g 'daemon off;'
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: ${{ inputs.web_image }}
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
spec:
  serviceName: ${{ defaults.app_name }}
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels: { app: '${{ defaults.app_name }}' }
  template:
    metadata:
      labels: { app: '${{ defaults.app_name }}' }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, fsGroup: 101 }
      containers:
        - name: ${{ defaults.app_name }}
          image: ${{ inputs.web_image }}
          imagePullPolicy: IfNotPresent
          # Render the image's shared template into the writable /tmp claim.
          command: [/bin/sh, /etc/mem/start-web.sh]
          env:
            - { name: MEMD_UPSTREAM, value: 'http://${{ defaults.app_name }}-memd.${{ SEALOS_NAMESPACE }}.svc.cluster.local:8080' }
            - { name: MEM_MAX_BODY_SIZE, value: 64m }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: 20m, memory: 25Mi }
            limits: { cpu: 200m, memory: 256Mi }
          volumeMounts:
            - name: ${{ defaults.app_name }}-cm
              mountPath: /etc/mem/start-web.sh
              subPath: vn-etcvn-memvn-startvn-webvn-sh
            - { name: vn-tmp, mountPath: /tmp }
            - { name: vn-varvn-cachevn-nginx, mountPath: /var/cache/nginx }
      volumes:
        - name: ${{ defaults.app_name }}-cm
          configMap: { name: '${{ defaults.app_name }}' }
  volumeClaimTemplates:
    - metadata:
        name: vn-tmp
        labels: { cloud.sealos.io/deploy-on-sealos: '${{ defaults.app_name }}' }
        annotations: { path: /tmp, value: '1' }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
    - metadata:
        name: vn-varvn-cachevn-nginx
        labels: { cloud.sealos.io/deploy-on-sealos: '${{ defaults.app_name }}' }
        annotations: { path: /var/cache/nginx, value: '1' }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
spec:
  ports: [{ name: http, port: 8080, targetPort: http }]
  selector: { app: '${{ defaults.app_name }}' }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/enable-access-log: 'false'
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port: { number: 8080 }
  tls:
    - hosts: ['${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}']
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: ''
  name: mem personal preview
  type: link
