name: Release

run-name: Release ${{ inputs.version || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing annotated tag to publish (for example, v0.1.1)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate immutable release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check out requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.version) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate annotated tag, commit and version surfaces
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${REF_NAME}}"
          if [[ ! "${version}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$ ]]; then
            echo "expected an existing release tag such as v0.1.1, got: ${version:-<empty>}" >&2
            exit 1
          fi
          if [[ "${EVENT_NAME}" == push && "${FULL_REF}" != "refs/tags/${version}" ]]; then
            echo "push ref ${FULL_REF} does not match release tag ${version}" >&2
            exit 1
          fi
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/tags/${version}:refs/tags/${version}"
          commit="$(./scripts/validate_release_source.sh "${version}")"
          printf 'tag=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'commit=%s\n' "${commit}" >> "${GITHUB_OUTPUT}"

      - name: Refuse an existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_TAG} already exists" >&2
            exit 1
          fi

  build:
    name: Build mem-mcp binaries
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: mem-mcp-linux-amd64
          - goos: linux
            goarch: arm64
            asset: mem-mcp-linux-arm64
          - goos: darwin
            goarch: amd64
            asset: mem-mcp-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: mem-mcp-darwin-arm64
          - goos: windows
            goarch: amd64
            asset: mem-mcp-windows-amd64.exe
          - goos: windows
            goarch: arm64
            asset: mem-mcp-windows-arm64.exe
    steps:
      - name: Check out exact tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate release source
        env:
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.commit }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          actual_commit="$(./scripts/validate_release_source.sh "${RELEASE_TAG}")"
          [[ "${actual_commit}" == "${EXPECTED_COMMIT}" ]]

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build mem-mcp (${{ matrix.asset }})
        working-directory: server
        env:
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/assets"
          output="${RUNNER_TEMP}/assets/${{ matrix.asset }}"
          CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -buildvcs=true -trimpath -ldflags='-s -w' \
            -o "${output}" ./cmd/mem-mcp
          go version -m "${output}" | grep -F "vcs.revision=${EXPECTED_COMMIT}"
          go version -m "${output}" | grep -F 'vcs.modified=false'

      - name: Upload asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/assets/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate release source and render notes
        env:
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.commit }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          actual_commit="$(./scripts/validate_release_source.sh "${RELEASE_TAG}")"
          [[ "${actual_commit}" == "${EXPECTED_COMMIT}" ]]
          ./scripts/render_release_notes.sh "${RELEASE_TAG}" \
            > "${RUNNER_TEMP}/release-notes.md"
          test -s "${RUNNER_TEMP}/release-notes.md"

      - name: Download all assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: /tmp/release-assets
          pattern: mem-mcp-*
          merge-multiple: true

      - name: Validate exact assets and generate checksums
        env:
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.commit }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          ./scripts/generate_release_checksums.sh \
            "${RELEASE_TAG}" "${EXPECTED_COMMIT}" /tmp/release-assets

      - name: Revalidate tag and create draft Release
        env:
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          actual_commit="$(./scripts/validate_release_source.sh "${RELEASE_TAG}")"
          [[ "${actual_commit}" == "${EXPECTED_COMMIT}" ]]
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_TAG} already exists" >&2
            exit 1
          fi

          assets=(
            /tmp/release-assets/mem-mcp-darwin-amd64
            /tmp/release-assets/mem-mcp-darwin-arm64
            /tmp/release-assets/mem-mcp-linux-amd64
            /tmp/release-assets/mem-mcp-linux-arm64
            /tmp/release-assets/mem-mcp-windows-amd64.exe
            /tmp/release-assets/mem-mcp-windows-arm64.exe
            /tmp/release-assets/mem-mcp-checksums.txt
          )
          release_flags=()
          if [[ "${RELEASE_TAG}" == *-rc.* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --verify-tag \
            --title "${RELEASE_TAG}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            "${release_flags[@]}" \
            "${assets[@]}"

      - name: Verify remote draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          release_json="$(
            gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json tagName,isDraft,assets
          )"
          jq -e --arg tag "${RELEASE_TAG}" '
            .tagName == $tag and
            .isDraft == true and
            (.assets | length == 7) and
            all(.assets[]; ((.size | type) == "number") and (.size > 0))
          ' <<< "${release_json}" >/dev/null

          expected_assets="$(printf '%s\n' \
            mem-mcp-checksums.txt \
            mem-mcp-darwin-amd64 \
            mem-mcp-darwin-arm64 \
            mem-mcp-linux-amd64 \
            mem-mcp-linux-arm64 \
            mem-mcp-windows-amd64.exe \
            mem-mcp-windows-arm64.exe | LC_ALL=C sort)"
          actual_assets="$(jq -r '.assets[].name' <<< "${release_json}" | LC_ALL=C sort)"
          if [[ "${actual_assets}" != "${expected_assets}" ]]; then
            echo "draft Release asset inventory does not match the expected seven files" >&2
            printf 'expected:\n%s\nactual:\n%s\n' "${expected_assets}" "${actual_assets}" >&2
            exit 1
          fi

      - name: Publish verified Release
        env:
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          actual_commit="$(./scripts/validate_release_source.sh "${RELEASE_TAG}")"
          [[ "${actual_commit}" == "${EXPECTED_COMMIT}" ]]

          release_json="$(
            gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json tagName,isDraft,assets
          )"
          jq -e --arg tag "${RELEASE_TAG}" '
            .tagName == $tag and
            .isDraft == true and
            (.assets | length == 7) and
            all(.assets[]; ((.size | type) == "number") and (.size > 0))
          ' <<< "${release_json}" >/dev/null
          expected_assets="$(printf '%s\n' \
            mem-mcp-checksums.txt \
            mem-mcp-darwin-amd64 \
            mem-mcp-darwin-arm64 \
            mem-mcp-linux-amd64 \
            mem-mcp-linux-arm64 \
            mem-mcp-windows-amd64.exe \
            mem-mcp-windows-arm64.exe | LC_ALL=C sort)"
          actual_assets="$(jq -r '.assets[].name' <<< "${release_json}" | LC_ALL=C sort)"
          [[ "${actual_assets}" == "${expected_assets}" ]]

          gh release edit "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false

  npm-publish:
    name: Publish npm package via Trusted Publishing
    needs: [preflight, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate release source
        env:
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.commit }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          actual_commit="$(./scripts/validate_release_source.sh "${RELEASE_TAG}")"
          [[ "${actual_commit}" == "${EXPECTED_COMMIT}" ]]

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify published Release before npm
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          release_json="$(
            gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json tagName,isDraft,assets
          )"
          jq -e --arg tag "${RELEASE_TAG}" '
            .tagName == $tag and
            .isDraft == false and
            (.assets | length == 7)
          ' <<< "${release_json}" >/dev/null

      - name: Validate npm package version matches release
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        working-directory: npm
        run: |
          set -euo pipefail
          expected_version="${RELEASE_TAG#v}"
          actual_version="$(node -p 'require("./package.json").version')"
          if [[ "${actual_version}" != "${expected_version}" ]]; then
            echo "npm package.json version ${actual_version} does not match release ${expected_version}" >&2
            exit 1
          fi

      - name: Run npm package tests
        working-directory: npm
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm test
          npm run test:tarball

      - name: Verify version not already published
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        working-directory: npm
        run: |
          set -euo pipefail
          expected_version="${RELEASE_TAG#v}"
          package_name="$(node -p 'require("./package.json").name')"
          if npm view "${package_name}@${expected_version}" version >/dev/null 2>&1; then
            echo "npm ${package_name}@${expected_version} already exists" >&2
            exit 1
          fi

      - name: Publish to npm via Trusted Publishing
        working-directory: npm
        run: |
          set -euo pipefail
          npm publish --access public --tag latest

      - name: Verify npm publication
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        working-directory: npm
        run: |
          set -euo pipefail
          expected_version="${RELEASE_TAG#v}"
          package_name="$(node -p 'require("./package.json").name')"
          published_version="$(npm view "${package_name}" dist-tags.latest)"
          if [[ "${published_version}" != "${expected_version}" ]]; then
            echo "npm latest is ${published_version}, expected ${expected_version}" >&2
            exit 1
          fi
          echo "Successfully published ${package_name}@${expected_version}"